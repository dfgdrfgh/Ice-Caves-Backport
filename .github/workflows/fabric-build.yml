name: Fabric 1.21.1 merged source build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare intermediary-named mapping for recovered source
        run: |
          curl --fail --location --retry 3 \
            'https://maven.fabricmc.net/net/fabricmc/intermediary/1.21.1/intermediary-1.21.1-v2.jar' \
            --output /tmp/intermediary-1.21.1-v2.jar
          python3 .github/scripts/make_named_intermediary.py /tmp/intermediary-1.21.1-v2.jar mapping/intermediary-named.jar
      - name: Compile and package
        run: gradle build --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fabric-1.21.1-merged-jar
          path: build/libs/*.jar
