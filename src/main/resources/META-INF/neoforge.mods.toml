# NeoForge 21.1 metadata. NeoForge reads META-INF/neoforge.mods.toml and only sees the
# net.neoforged @Mod entry point, so the merged jar can carry Forge metadata alongside it.
modLoader="javafml"
loaderVersion="[4,)"
license="All-Rights-Reserved"

[[mixins]]
config="ice_caves.neoforge.mixins.json"

[[mods]]
modId="ice_caves"
version="1.0.0"
displayName="Ice Caves"
logoFile="ice_caves.png"
credits=""
authors="zerw"
description='''Ice Caves adds icy blocks and items for frozen caves exploration.'''

[[dependencies.ice_caves]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.ice_caves]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1,1.22)"
    ordering="NONE"
    side="BOTH"